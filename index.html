  .pay > * { position: relative; z-index: 1; }
  .pay h1 {
    margin: 0 0 1.25rem;
    font: 500 1.05rem/1.3 "Josefin Sans", system-ui, sans-serif;
    letter-spacing: .02em;
    color: #C9DDB3;
  }
  .holder { margin: 0; font-size: 1rem; color: #DCE6D2; }
  .number {
    display: block;
    margin: .1rem 0 1.4rem;
    font: 600 clamp(2.4rem, 11vw, 3.1rem)/1.1 "Cormorant Garamond", Georgia, serif;
    letter-spacing: .01em;
    font-variant-numeric: lining-nums;
    color: #fff;
  }
  .copy {
    display: flex; align-items: center; justify-content: center; gap: .6rem;
    width: 100%;
    min-height: 3.4rem;
    border: 0;
    border-radius: 999px;
    background: var(--agave);
    color: #fff;
    font: 600 1.05rem/1 "Josefin Sans", system-ui, sans-serif;
    cursor: pointer;
    transition: background-color .2s, transform .1s;
  }
  .copy:hover { background: #67A32F; }
  .copy:active { transform: scale(.98); }
  .copy.done { background: var(--flor); color: var(--maguey); }
  .copy svg { width: 1.2rem; height: 1.2rem; flex: none; }
  .help { margin: 1rem 0 0; font-size: .92rem; line-height: 1.5; color: #C9D6BC; max-width: 22rem; }

  .shop {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    margin: 1.25rem 0 0;
    padding: 1.15rem 1.4rem;
    border: 1.5px solid var(--agave);
    border-radius: 1rem;
    color: var(--ink);
    text-decoration: none;
    transition: background-color .2s;
  }
  .shop:hover { background: var(--sage); }
  .shop strong { display: block; font: italic 500 1.55rem/1.15 "Cormorant Garamond", Georgia, serif; }
  .shop span { font-size: .9rem; color: var(--muted); }
  .shop svg { width: 1.4rem; height: 1.4rem; flex: none; color: var(--agave); }

  h2 {
    margin: 2.25rem 0 .9rem;
    font: italic 500 1.55rem/1.2 "Cormorant Garamond", Georgia, serif;
    text-align: center;
  }
  .social { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
  .social a {
    display: flex; align-items: center; gap: .7rem;
    padding: .85rem 1rem;
    border-radius: .85rem;
    background: var(--sage);
    color: var(--ink);
    text-decoration: none;
    font-size: .95rem;
    transition: background-color .2s;
  }
  .social a:hover { background: #DCE7CF; }
  .social svg { width: 1.3rem; height: 1.3rem; flex: none; fill: var(--maguey); }

  footer { margin-top: 2.25rem; text-align: center; font: italic 500 1.2rem/1.4 "Cormorant Garamond", Georgia, serif; color: var(--muted); }

  a:focus-visible, button:focus-visible { outline: 3px solid var(--flor); outline-offset: 3px; }
  @media (max-width: 22rem) { .social { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<script>
(function () {
  var btn = document.getElementById('copy');
  var txt = document.getElementById('copy-txt');
  var timer;

  function fallback(value) {
    var ta = document.createElement('textarea');
    ta.value = value;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, value.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }

  function show(ok) {
    btn.classList.toggle('done', ok);
    txt.textContent = ok ? 'Número copiado' : 'Copie: 927792089';
    clearTimeout(timer);
    timer = setTimeout(function () {
      btn.classList.remove('done');
      txt.textContent = 'Copiar número';
    }, 2500);
  }

  btn.addEventListener('click', function () {
    var value = btn.getAttribute('data-copy');
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(value).then(function () { show(true); }, function () { show(fallback(value)); });
    } else {
      show(fallback(value));
    }
  });
})();
</script>
