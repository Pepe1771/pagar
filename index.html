<style>
  :root {
    --navy: #09094F;
    --navy-2: #13136B;
    --royal: #3856DA;
    --sky: #0099FE;
    --ice: #EAF0FF;
    --white: #FFFFFF;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--navy); }
  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 8% 12%, var(--royal) 0 46px, transparent 47px),
      radial-gradient(circle at 99% 47%, var(--sky) 0 30px, transparent 31px),
      radial-gradient(circle at 85% 92%, var(--royal) 0 60px, transparent 61px),
      radial-gradient(circle at 4% 78%, var(--sky) 0 22px, transparent 23px),
      var(--navy);
    color: var(--white);
    font-family: "Fredoka", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    padding: 28px 18px 40px;
  }
  main { width: 100%; max-width: 420px; text-align: center; }

  .logo {
    width: 180px; height: 180px; max-width: 100%;
    display: block; margin: 0 auto 6px;
    animation: pop .6s cubic-bezier(.3,1.5,.5,1) both;
  }
  @keyframes pop { from { transform: scale(.6) rotate(-12deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }

  h1 { font-weight: 600; font-size: 1.6rem; line-height: 1.2; margin-bottom: 6px; }
  .lead { color: #C7D0FF; font-size: 1.02rem; line-height: 1.45; margin: 0 auto 26px; max-width: 32ch; }

  .pay {
    background: var(--white);
    color: var(--navy);
    border-radius: 28px 28px 28px 8px;
    padding: 20px 20px 18px;
    text-align: left;
    box-shadow: 0 6px 0 var(--royal);
  }
  .pay + .pay { margin-top: 22px; border-radius: 28px 28px 8px 28px; box-shadow: 0 6px 0 var(--sky); }

  .pay h2 { font-size: 1.05rem; font-weight: 600; color: var(--royal); margin-bottom: 4px; }
  .pay + .pay h2 { color: #0077C8; }
  .value {
    font-weight: 700;
    font-size: 2.2rem;
    letter-spacing: .02em;
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }
  .value.iban { font-size: 1.25rem; font-weight: 600; letter-spacing: .03em; }
  .hint { font-size: .92rem; color: #4A4F80; margin-top: 6px; line-height: 1.4; }

  button {
    margin-top: 14px;
    width: 100%;
    min-height: 52px;
    border: 0;
    border-radius: 999px;
    font: inherit;
    font-size: 1.08rem;
    font-weight: 600;
    color: var(--white);
    background: var(--royal);
    cursor: pointer;
    transition: background .2s, transform .1s;
  }
  .pay + .pay button { background: var(--navy); }
  button:active { transform: scale(.98); }
  button:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
  button.done { background: #1E9E5A !important; }

  .note { margin-top: 30px; font-size: .9rem; color: #A9B4F2; line-height: 1.45; }
</style>
</head>

<script>
  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }
  document.querySelectorAll('button[data-copy]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var text = btn.getAttribute('data-copy');
      var show = function (ok) {
        btn.textContent = ok ? 'Copiado ✓' : 'Não foi possível copiar — mantenha o dedo no número';
        if (ok) btn.classList.add('done');
        setTimeout(function () {
          btn.textContent = btn.getAttribute('data-label');
          btn.classList.remove('done');
        }, 2200);
      };
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).then(function () { show(true); }, function () { show(fallbackCopy(text)); });
      } else {
        show(fallbackCopy(text));
      }
    });
  });
</script>
