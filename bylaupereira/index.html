  /* Borda dourada com cantos redondos: fundo no padding-box, ouro no border-box */
  .gold { position: relative; background: var(--fill, var(--cream)); }
  .gold::before {
    content: "";
    position: absolute; inset: 0;
    border-radius: inherit;
    padding: 2px;
    background: var(--gold);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
    pointer-events: none;
    z-index: 3;
  }

  .frame {
    --fill: rgba(246, 236, 214, .25);
    position: relative;
    overflow: hidden;
    max-width: 30rem;
    margin: .9rem auto 1.2rem;
    width: calc(100% - 1.5rem);
    border-radius: 1.75rem;
    padding: 1.6rem 1.1rem 6rem;
    box-shadow: 0 10px 40px rgba(120, 90, 30, .12);
  }
  .frame > * { position: relative; z-index: 1; }

  .mid-line { position: absolute; z-index: 0; bottom: 1.35rem; height: 2px; width: 4.5rem; border-radius: 2px; background: var(--gold); }
  .mid-line.ml { right: calc(50% + 2.5rem); }
  .mid-line.mr { left: calc(50% + 2.5rem); }

  .logo { display: block; width: min(100%, 21rem); height: auto; margin: 0 auto 1.4rem; }

  /* Cartão MB WAY */
  .pay {
    --fill: linear-gradient(160deg, #255A2B 0%, var(--green) 45%, var(--green-2) 100%);
    position: relative;
    overflow: hidden;
    border-radius: 1.4rem;
    padding: 1.4rem 1.25rem 1.3rem;
    color: #F5F2E8;
    box-shadow: 0 8px 24px rgba(20, 53, 24, .28), inset 0 1px 0 rgba(255,255,255,.08);
  }
  .pay .leafy { width: 11.5rem; height: 6.3rem; right: -3.4rem; bottom: -1.2rem; transform: rotate(-26deg); }
  .pay-top { display: grid; grid-template-columns: 1fr auto; gap: .5rem; align-items: center; }
  .pay h1 { margin: 0 0 .55rem; font: 500 clamp(1.25rem, 5.6vw, 1.5rem)/1.2 "Josefin Sans", system-ui, sans-serif; }
  .holder { margin: 0; font-size: clamp(1rem, 4.4vw, 1.15rem); color: #E7E2D2; }
  .number {
    display: block;
    margin: .15rem 0 0;
    white-space: nowrap;
    font: 700 clamp(2.05rem, 9.6vw, 3rem)/1.15 "Cormorant Garamond", Georgia, serif;
    font-variant-numeric: lining-nums;
    color: #fff;
  }
  .phone { width: clamp(3.3rem, 15vw, 4.4rem); height: auto; }

  .copy {
    position: relative; z-index: 1;
    display: flex; align-items: center; justify-content: center; gap: .65rem;
    width: 100%;
    min-height: 3.3rem;
    margin-top: 1.15rem;
    border-radius: 999px;
    --fill: linear-gradient(180deg, #5E9A35, #3F7A23);
    color: #FFFDF5;
    font: 500 1.12rem/1 "Josefin Sans", system-ui, sans-serif;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,.25);
    transition: filter .2s, transform .1s;
  }
  .copy:hover { filter: brightness(1.08); }
  .copy:active { transform: scale(.98); }
  .copy.done { --fill: linear-gradient(180deg, #F2D88C, #CFA54C); color: var(--green-2); }
  .copy svg { width: 1.25rem; height: 1.25rem; flex: none; }
  .help { position: relative; z-index: 1; margin: .95rem 0 0; max-width: 14.5rem; font-size: .95rem; line-height: 1.45; color: #E6E2D4; }

  /* Loja */
  .shop {
    --fill: linear-gradient(rgba(250, 243, 228, .88), rgba(250, 243, 228, .88));
    position: relative;
    overflow: hidden;
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: .6rem;
    margin-top: 1.1rem;
    padding: 1.35rem 1.4rem 1.35rem 1.2rem;
    border-radius: 1.3rem;
    color: var(--ink);
    text-decoration: none;
    box-shadow: 0 6px 18px rgba(120, 90, 30, .1);
  }
  .shop .leafy { width: 10rem; height: 5.5rem; left: -3.6rem; bottom: -1.3rem; transform: rotate(32deg); }
  .shop-txt { position: relative; z-index: 1; padding-left: 3.2rem; min-width: 0; }
  .shop strong { display: block; font: italic 500 clamp(1.35rem, 5.6vw, 1.8rem)/1.1 "Cormorant Garamond", Georgia, serif; }
  .shop span { display: block; margin-top: .2rem; font-size: clamp(.95rem, 4vw, 1.1rem); color: var(--muted); }
  .shop .arrow { position: relative; z-index: 1; display: block; width: 2.8rem; height: auto; }

  /* Redes */
  .rule { display: flex; align-items: center; gap: .9rem; margin: 1.6rem 0 .8rem; }
  .rule::before, .rule::after { content: ""; flex: 1; height: 1.5px; background: var(--gold); opacity: .8; }
  .rule h2 { margin: 0; font: italic 500 1.65rem/1 "Cormorant Garamond", Georgia, serif; }

  .social { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
  .social a {
    --fill: linear-gradient(rgba(250, 243, 228, .9), rgba(250, 243, 228, .9));
    display: flex; align-items: center; gap: .65rem;
    padding: .7rem .95rem;
    border-radius: 999px;
    color: var(--ink);
    text-decoration: none;
    font-size: 1rem;
    transition: filter .2s;
  }
  .social a:hover { --fill: linear-gradient(#F4EAD2, #F4EAD2); }
  .social svg { width: 1.35rem; height: 1.35rem; flex: none; fill: #1D1B16; }

  footer { margin-top: 1.4rem; text-align: center; font: italic 500 1.2rem/1.4 "Cormorant Garamond", Georgia, serif; color: #3A3428; }

  a:focus-visible, button:focus-visible { outline: 3px solid #C0913A; outline-offset: 3px; }
  @media (max-width: 21rem) { .social { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

(function () {
  var btn = document.getElementById('copy');

  var timer;
  function fallback(value) {
    var ta = document.createElement('textarea');
    ta.value = value; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, value.length);
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    return ok;
  }
  function show(ok) {
    btn.classList.toggle('done', ok);
    txt.textContent = ok ? 'Número copiado' : 'Copie: 927792089';
    clearTimeout(timer);
    timer = setTimeout(function () { btn.classList.remove('done'); txt.textContent = 'Copiar número'; }, 2500);

  btn.addEventListener('click', function () {
    var value = btn.getAttribute('data-copy');
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(value).then(function () { show(true); }, function () { show(fallback(value)); });
    } else { show(fallback(value)); }
  });
})();
